{{- if .Values.podMonitor.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "liturgical-app.fullname" . }}
  labels:
    {{- include "liturgical-app.labels" . | nindent 4 }}
spec:
  selector:
    matchLabels:
      {{- include "liturgical-app.selectorLabels" . | nindent 6 }}
  podMetricsEndpoints:
  - port: http
    interval: {{ .Values.podMonitor.interval }}
{{- end }}